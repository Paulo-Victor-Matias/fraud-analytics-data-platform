services:
  postgres:
    image: postgres:16
    container_name: fraud_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: fraud_admin_pw
      POSTGRES_DB: fraud_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
